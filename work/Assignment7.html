<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment6</title>
    <style>
        .img1{
            border: 2px solid;
            height: 300px;
            width: 300px;
            
        }
        .dive{
            height: 300px;
            width: 100%;
            display: flex;
            justify-content: center;

        }
    </style>
</head>
<body>
    <div  class="dive">
        <img id="3" class="img1" src="../Assets/paneer.jpg" alt="paneer"><br> 
    </div>
    <div  align="center"><h2 id="4">paneer</h2></div>
    <div align="center">
        <button  onclick="toggleimg1()">Previous img</button>
        <button  onclick="toggleimg2()">next img</button></div>

<script>
   

    function toggleimg1(){
        const img = document.getElementById("3");
        const name = document.getElementById("4");
        if(img.src.includes("paneer.jpg")){
            img.src = "../Assets/pizza.jpg";
            img.alt = "pizza";
            name.textContent = "pizza";
        }
        
        else{
            img.src = "../Assets/paneer.jpg";
            img.alt = "paneer";
            name.textContent = "paneer";
        }
    }
    function toggleimg2(){
        const img = document.getElementById("3");
        const name = document.getElementById("4");
        if(img.src.includes("pizza.jpg")){
            img.src = "../Assets/paneer.jpg";
            img.alt = "paneer";
            name.textContent = "paneer";
        }
        
        else{
            img.src = "../Assets/pizza.jpg";
            img.alt = "pizza";
            name.textContent = "pizza";
        }
    }

</script>
</body>
</html>
